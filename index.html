<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>TheFactory Foos Ligaen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{
  /* Hvite flater, kontorets blå som primær, rav/turkis/korall som komplement */
  --bg:#F4F7FC;
  --card:#FFFFFF; --card-2:#F5F8FD; --field:#FFFFFF;
  --line:#E9EEF6; --line-strong:#D3DCEC;
  --text:#1B3A6B; --body:#6C7A94; --muted:#8A96AD; --on-text:#FFFFFF; --logo:#1E1E1E;
  --brand:#2F7BF5; --brand-ink:#FFFFFF; --brand-soft:#E7F0FE; --brand-disabled:#8FB8F5;
  --amber:#F2A33C; --amber-soft:#FDF0DE; --amber-ink:#6B4308;
  --teal:#12A594; --teal-soft:#DDF4F1;
  --coral:#E05B4D;
  --tA:#1E1E1E; --tA-ring:#1E1E1E; --tA-ink:#FFFFFF;
  --tB:#FFFFFF; --tB-ring:#1E1E1E; --tB-ink:#1B3A6B;
  --gold:#F2A33C; --silver:#CBD5E3; --bronze:#D9A07A; --podium-ink:#2A1E08;
  --live:#12A594; --danger:#E05B4D;
  --toast-bg:#1B3A6B; --toast-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(27,58,107,.04), 0 8px 24px rgba(27,58,107,.06);
  --shadow-brand:0 6px 16px rgba(47,123,245,.28);
  --r-card:26px; --r-ctl:16px;
  --font-display:"Nunito","Avenir Next Rounded","Avenir",system-ui,sans-serif;
  --font-body:"Nunito Sans","Avenir Next","Avenir",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1420;
    --card:#19202E; --card-2:#212936; --field:#1D2532;
    --line:#2A3444; --line-strong:#3C4859;
    --text:#EAEFF8; --body:#B6C1D4; --muted:#8A97AE; --on-text:#0F1420; --logo:#F5F7FA;
    --brand:#5B95F7; --brand-ink:#FFFFFF; --brand-soft:#1E3255; --brand-disabled:#3A527F;
    --amber:#E2A34C; --amber-soft:#3A2C17; --amber-ink:#FFE2B8;
    --teal:#3BBFAE; --teal-soft:#16332F;
    --coral:#F0776A;
    --tA:#05080F; --tA-ring:#B3BECF; --tA-ink:#FFFFFF;
    --tB:#F5F8FF; --tB-ring:#F5F8FF; --tB-ink:#0F1420;
    --gold:#E2A34C; --silver:#A8B2C1; --bronze:#C08A63; --podium-ink:#1A1408;
    --live:#3BBFAE; --danger:#F0776A;
    --toast-bg:#EAEFF8; --toast-ink:#0F1420;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --shadow-brand:0 6px 16px rgba(91,149,247,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1420;
  --card:#19202E; --card-2:#212936; --field:#1D2532;
  --line:#2A3444; --line-strong:#3C4859;
  --text:#EAEFF8; --body:#B6C1D4; --muted:#8A97AE; --on-text:#0F1420; --logo:#F5F7FA;
  --brand:#5B95F7; --brand-ink:#FFFFFF; --brand-soft:#1E3255; --brand-disabled:#3A527F;
  --amber:#E2A34C; --amber-soft:#3A2C17; --amber-ink:#FFE2B8;
  --teal:#3BBFAE; --teal-soft:#16332F;
  --coral:#F0776A;
  --tA:#05080F; --tA-ring:#B3BECF; --tA-ink:#FFFFFF;
  --tB:#F5F8FF; --tB-ring:#F5F8FF; --tB-ink:#0F1420;
  --gold:#E2A34C; --silver:#A8B2C1; --bronze:#C08A63; --podium-ink:#1A1408;
  --live:#3BBFAE; --danger:#F0776A;
  --toast-bg:#EAEFF8; --toast-ink:#0F1420;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --shadow-brand:0 6px 16px rgba(91,149,247,.3);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--body);font:400 16px/1.45 var(--font-body);min-height:100vh;padding-bottom:40px}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:800;line-height:1.1;color:var(--text);text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
ul,ol{list-style:none;margin:0;padding:0}
a{color:var(--brand)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);padding:22px 20px}

/* Topp-kort med logo */
.hero{margin-top:16px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.kicker{flex:1;min-width:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.hero h1{font-size:38px;font-weight:900;letter-spacing:-.015em;margin-top:8px}
.logo{flex:none;width:62px;line-height:0;padding-top:1px}
.logo img{display:block;width:100%;height:auto;max-width:100%}
.logo .logo-dark{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .logo .logo-light{display:none}
  :root:not([data-theme="light"]) .logo .logo-dark{display:block}
}
:root[data-theme="dark"] .logo .logo-light{display:none}
:root[data-theme="dark"] .logo .logo-dark{display:block}
.lede{color:var(--body);font-size:16px;line-height:1.5;margin-top:12px;max-width:34ch}
.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.hdr-stats{font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--text)}
.mode{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--card-2);border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.mode::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;opacity:.6;vertical-align:1px}
.mode.is-shared{color:var(--text);background:var(--teal-soft);border-color:transparent}
.mode.is-shared::before{background:var(--live);opacity:1}
.mode.is-connecting::before{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.15}}

/* Fanevelger */
.tabs{position:sticky;top:10px;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:5px;margin-top:14px;border-radius:22px}
.tabs button{min-height:46px;padding:6px 3px;border:0;border-radius:16px;background:none;color:var(--body);font-family:var(--font-display);font-weight:800;font-size:13px;line-height:1.15}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:var(--shadow-brand)}

main{padding-block:14px 8px;display:flex;flex-direction:column;gap:14px}
.card > .block + .block{margin-top:24px}
.card > .primary{margin-top:24px}
.card-head{margin-bottom:20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-head > div{min-width:0}
.card-head h2{font-size:25px}
.card-head .lede-sm{color:var(--body);margin-top:4px;font-size:15px;line-height:1.45}
.block{display:flex;flex-direction:column;gap:10px}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.block-head h2{font-size:23px}
.block-head h3{font-size:17px;font-weight:800}
.block-head .opt{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.hint{font-size:13.5px;color:var(--body)}
.hint.center{text-align:center}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:800;font-size:14px}
.link.quiet{color:var(--body);font-weight:700}
.link.danger{color:var(--danger)}

/* Spillerchips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px 0 12px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--field);color:var(--text);font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:9px;transition:transform .08s ease}
.chip::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--line-strong);flex:none}
.chip:active{transform:scale(.96)}
.chip.is-a{background:var(--tA);border-color:var(--tA-ring);color:var(--tA-ink)}
.chip.is-a::before{background:var(--tA);box-shadow:0 0 0 2px var(--tA-ink)}
.chip.is-b{background:var(--tB);border-color:var(--tB-ring);border-width:2px;color:var(--tB-ink)}
.chip.is-b::before{background:var(--tB);box-shadow:0 0 0 2px var(--tB-ring)}
.chip.is-on{background:var(--brand-soft);border-color:var(--brand);color:var(--text)}
.chip.is-on::before{background:var(--brand)}
.newplayer{display:flex;gap:8px}
.newplayer input{flex:1;min-width:0;height:52px;border:1.5px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--field);color:var(--text);padding:0 16px;font:600 16px var(--font-body)}
.newplayer button{height:52px;padding:0 18px;border-radius:var(--r-ctl);border:0;background:var(--brand);color:var(--brand-ink);font-weight:800}

/* Lagkort */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{position:relative;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:118px;padding:14px 13px 16px;border:2px solid var(--line-strong);border-radius:20px;background:var(--field);transition:border-color .12s ease,box-shadow .12s ease}
.team-mark{width:36px;height:12px;border-radius:6px;border:2px solid var(--tA-ring);background:var(--tA)}
.team-b .team-mark{border-color:var(--tB-ring);background:var(--tB)}
.team-label{font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.team-names{font-family:var(--font-display);font-weight:900;font-size:21px;line-height:1.1;color:var(--text);overflow-wrap:anywhere}
.team-names.empty{font-family:var(--font-body);font-weight:600;font-size:14px;color:var(--muted);line-height:1.35}
.team.is-winner{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.won-badge{position:absolute;top:10px;right:10px;background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px}

/* Husregler */
.rules{display:flex;flex-direction:column}
.rule{display:grid;grid-template-columns:32px 1fr;align-items:start;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line)}
.rules > .rule:first-child{border-top:0;padding-top:0}
.rule-n{width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--text);font-family:var(--font-display);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.rule-t{font-size:16px;line-height:1.45;color:var(--text);font-weight:600;padding-top:5px;overflow-wrap:anywhere;white-space:pre-line}
.rule-edit{grid-column:2;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.rule-edit textarea,.newrule textarea{width:100%;min-height:76px;resize:none;overflow:hidden;border:1.5px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--field);color:var(--text);padding:14px 16px;font:600 16px/1.4 var(--font-body)}
.rule-edit textarea:focus,.newrule textarea:focus{border-color:var(--brand);outline:none}
.newrule{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.mini{height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--field);color:var(--body);font-size:13px;font-weight:800}
.mini.confirm,.mini.danger{border-color:var(--danger);color:var(--danger)}
.mini.go{border-color:var(--brand);color:var(--brand)}

/* Spillere */
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.plist > .prow:first-child{border-top:0;padding-top:2px}
.prow .av{flex:none}
.pname{flex:1;min-width:0;font-weight:800;color:var(--text);font-size:16px;overflow-wrap:anywhere}
.pmeta{font-size:13px;color:var(--body);white-space:nowrap;font-weight:600}
.prow input{flex:1;min-width:0;height:48px;border:1.5px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--field);color:var(--text);padding:0 14px;font:700 16px var(--font-body)}
.prow input:focus{border-color:var(--brand);outline:none}
.prow.gone .pname{color:var(--muted);font-weight:700}

/* Figurer */
.av{display:block;flex:none}
.av-name{display:flex;align-items:center;gap:9px;min-width:0}
.av-name .txt{min-width:0}
td.name .av-name b{font-weight:800;color:var(--text)}
.chip .av{margin-left:-4px}

/* Garderobe */
.wr-pick{display:flex;flex-wrap:wrap;gap:8px}
.wr-pick .chip{padding:0 14px 0 6px}
.wr-stage{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 16px 18px;margin:4px 0 20px;border-radius:22px;background:var(--card-2);border:1px solid var(--line)}
.wr-stage .av{filter:drop-shadow(0 10px 16px rgba(27,58,107,.18))}
.wr-stage .who{font-family:var(--font-display);font-weight:900;font-size:22px;color:var(--text);margin-top:2px}
.wr-stage .sub{font-size:13px;color:var(--body)}
.wr-actions{display:flex;gap:8px;width:100%;margin-top:4px}
.wr-actions button{flex:1}
.wr-group{margin-top:18px}
.wr-group h3{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.wr-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent)}
.wr-opt{flex:none;width:62px;height:62px;border-radius:18px;border:2px solid var(--line);background:var(--line);padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wr-opt.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.chip.chip-av{padding:0 15px 0 5px}
.chip.chip-av::before{display:none}
.wr-pick .chip::before{display:none}
.wr-sw{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);padding:0;position:relative}
.wr-sw.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.wr-none{font-family:var(--font-display);font-weight:800;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* Lagkjemi */
.chem{display:flex;flex-direction:column}
.chem li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.chem li:first-child{border-top:0;padding-top:0}
.chem .pair{font-weight:800;color:var(--text);font-size:15px;overflow-wrap:anywhere}
.chem .det{font-size:12.5px;color:var(--body);font-weight:600;margin-top:2px}
.chem .dx{font-family:var(--font-display);font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chem .dx.pos{color:var(--teal)}
.chem .dx.neg{color:var(--coral)}
.bar{height:6px;border-radius:3px;background:var(--card-2);overflow:hidden;margin-top:6px;max-width:180px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--brand)}

/* Periodevelger */
.period{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.pbtn{width:36px;height:36px;flex:none;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--field);color:var(--text);font-size:20px;line-height:1;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 0 2px}
.pbtn:disabled{opacity:.3}
.plabel{flex:1;min-width:0;text-align:center;line-height:1.15}
.plabel b{display:block;font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plabel small{display:block;font-size:12px;color:var(--body);font-weight:600;margin-top:2px}
.ptoggle{flex:none;height:36px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--field);color:var(--text);font-family:var(--font-display);font-weight:800;font-size:13px}
.ptoggle.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pts.pos{color:var(--teal)}
.pts.neg{color:var(--coral)}
.month-h{font-family:var(--font-body);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:8px 6px 0}
.facts.hall li{grid-template-columns:82px 1fr}
.facts.hall b{color:var(--text);font-weight:800}

/* Segmentvelger */
.seg-wide{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:5px;border-radius:16px;background:var(--card-2);margin-bottom:18px}
.card > .seg-wide + .card-head{margin-top:0}
.seg-wide button{height:44px;border:0;border-radius:12px;background:none;font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--body)}
.seg-wide button.on{background:var(--brand);color:var(--brand-ink);box-shadow:var(--shadow-brand)}

/* Knapper */
.primary{width:100%;min-height:58px;border:0;border-radius:var(--r-ctl);background:var(--brand);color:var(--brand-ink);font-family:var(--font-display);font-weight:800;font-size:19px;padding:0 16px;box-shadow:var(--shadow-brand)}
.primary:disabled{background:var(--brand-disabled);box-shadow:none;font-size:16px}
.secondary{width:100%;min-height:52px;border:1.5px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--field);color:var(--text);font-family:var(--font-display);font-weight:800;font-size:16px}

/* Kamplister */
.matchlist{display:flex;flex-direction:column}
.match{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)}
.matchlist > .match:first-child{border-top:0;padding-top:4px}
.match .time{font-size:13px;color:var(--body);font-variant-numeric:tabular-nums;font-weight:600}
.match .sides{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-width:0}
.side{display:flex;align-items:center;gap:6px;min-width:0;font-size:14.5px;line-height:1.3;color:var(--body)}
.side .nm{min-width:0;overflow-wrap:break-word;hyphens:none}
.side.left{justify-content:flex-end;text-align:right}
.side.right{justify-content:flex-start;text-align:left}
.side.won{color:var(--text);font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot-a{background:var(--tA);box-shadow:0 0 0 1.5px var(--tA-ring)}
.dot-b{background:var(--tB);box-shadow:0 0 0 1.5px var(--tB-ring)}
.score.word{font-family:var(--font-body);font-weight:800;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 9px;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:11.5px;font-weight:800;letter-spacing:.02em;padding:4px 9px;border-radius:999px;background:var(--card-2);color:var(--body)}
.tag.crawl{background:var(--amber-soft);color:var(--amber-ink)}
.tag.add{border:1.5px dashed var(--line-strong);background:none;color:var(--body);font-family:inherit;cursor:pointer}
.tag.upset{background:var(--brand-soft);color:var(--text)}
.del{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line-strong);background:none;color:var(--muted);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;justify-self:end}
.del.confirm{width:auto;padding:0 10px;border-radius:999px;border-color:var(--danger);color:var(--danger);font-size:13px;font-weight:800}
.compact .match{grid-template-columns:40px minmax(0,1fr)}
.compact .del{display:none}
.crawlrow .sides{display:block;font-size:15px}
.crawlrow .sides b{font-weight:800;color:var(--text)}
.day-h{font-size:18px;margin-bottom:6px}

/* Tabell */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--card-2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat-n{font-family:var(--font-display);font-weight:900;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;color:var(--text)}
.stat-l{font-size:12px;color:var(--body);line-height:1.2;font-weight:600}
@media (max-width:440px){.stats{grid-template-columns:1fr 1fr}}
table.rank{width:100%;border-collapse:collapse;font-size:15px}
table.rank th{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 6px 8px;border-bottom:2px solid var(--line-strong)}
table.rank td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.rank th.r,table.rank td.r{text-align:right}
table.rank th:first-child,table.rank td:first-child{padding-left:0}
table.rank th:last-child,table.rank td:last-child{padding-right:0}
td.pos{width:44px;white-space:nowrap}
td.pos b{font-family:var(--font-display);font-weight:900;font-size:19px;font-variant-numeric:tabular-nums;color:var(--text)}
.trend{font-size:11px;font-weight:800;margin-left:3px;vertical-align:2px;color:var(--muted)}
.trend.up{color:var(--teal)}
.trend.new{background:var(--brand-soft);color:var(--text);padding:1px 6px;border-radius:999px}
td.name{font-weight:800;color:var(--text)}
td.name small{display:block;font-weight:600;font-size:12.5px;color:var(--body);line-height:1.25}
td.rating{font-family:var(--font-display);font-weight:900;font-size:19px;font-variant-numeric:tabular-nums;color:var(--text)}
td.rec{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700;color:var(--text)}
td.rec small{display:block;font-size:12px;color:var(--body);font-weight:600}
.form{display:inline-flex;gap:3px}
.form i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line-strong);display:inline-block}
.form i.w{background:var(--brand);border-color:var(--brand)}
.foot{font-size:13px;color:var(--body);line-height:1.45;margin-top:12px}
.newcomers{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--body)}
.newcomers b{color:var(--text);font-weight:800}
.facts{display:flex;flex-direction:column}
.facts li{display:grid;grid-template-columns:112px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.4}
.facts li:first-child{border-top:0;padding-top:0}
.fact-l{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.empty{padding:24px 16px;text-align:center;color:var(--body);font-size:15px;background:var(--card-2);border-radius:16px}

/* Krabbing */
.crawl-hero{text-align:center;padding:4px 0 6px}
.crawl-hero .big{display:block;font-family:var(--font-display);font-weight:900;font-size:70px;line-height:.95;font-variant-numeric:tabular-nums;color:var(--amber)}
.crawl-hero .lbl{display:block;font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--text);margin-top:4px}
.crawl-hero .sub{display:block;font-size:14px;color:var(--body);margin-top:6px}
.stage{margin:18px 0 20px;padding:0 2px}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:end}
.podium li{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.podium .av{margin-bottom:-2px;filter:drop-shadow(0 4px 6px rgba(27,58,107,.18))}
.podium .who{font-weight:800;font-size:14px;overflow-wrap:anywhere;color:var(--text);line-height:1.15}
.podium .ttl{font-size:11px;color:var(--muted);line-height:1.2;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.podium .box{position:relative;width:100%;border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--podium-ink);box-shadow:inset 0 -7px 0 rgba(0,0,0,.13), inset 0 2px 0 rgba(255,255,255,.35)}
.podium .box b{font-family:var(--font-display);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.podium .box small{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.72}
.podium .rank{position:absolute;top:5px;left:7px;font-family:var(--font-display);font-weight:900;font-size:12px;opacity:.4}
.podium .p1 .box b{font-size:40px}
.podium .p1{order:2}.podium .p2{order:1}.podium .p3{order:3}
.podium .p1 .box{height:104px;background:var(--gold)}
.podium .p2 .box{height:84px;background:var(--silver)}
.podium .p3 .box{height:68px;background:var(--bronze)}
.floor{height:8px;border-radius:0 0 6px 6px;background:linear-gradient(180deg,var(--line-strong),var(--card-2));box-shadow:0 6px 14px rgba(27,58,107,.10)}
.floor-lbl{text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:8px}
td.count{font-family:var(--font-display);font-weight:900;font-size:21px;font-variant-numeric:tabular-nums;color:var(--text)}
td.last{color:var(--body);font-size:13px;white-space:nowrap;font-weight:600}

/* Ark nederst */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(14,21,38,.5)}
.sheet-panel{position:relative;width:100%;max-width:560px;background:var(--card);border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.sheet-kicker{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sheet-title{font-size:32px;font-weight:900}
.sheet-result{font-size:15px;color:var(--body)}
.sheet .q{font-weight:800;font-size:16px;margin-top:4px;color:var(--text)}
.sheet-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
@media (min-width:720px){.sheet{align-items:center;padding:16px}.sheet-panel{border-radius:26px}}

/* Toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:14px;background:var(--toast-bg);color:var(--toast-ink);padding:12px 12px 12px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(27,58,107,.25);font-size:14.5px;font-weight:700;max-width:calc(100% - 32px);width:max-content}
.toast button{border:0;background:rgba(127,127,127,.25);color:inherit;font-weight:800;padding:7px 12px;border-radius:9px}

.demo-note{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--body);background:var(--amber-soft);color:var(--amber-ink);border-radius:14px;padding:10px 14px}
.demo-note .link{color:var(--amber-ink);text-decoration:underline;text-underline-offset:3px}

@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

  return new Date(iso).toLocaleDateString('nb-NO', { weekday: 'short', day: 'numeric', month: 'short' });
}
function daysAgoText(iso){
  const diff = daysBetween(iso);
  if (diff <= 0) return 'i dag';
  if (diff === 1) return 'i går';
  return 'for ' + diff + ' dager siden';
}
function daysAgoShort(iso){
  const t = daysAgoText(iso);
  return t.startsWith('for ') ? t.replace('for ', '').replace(' dager siden', ' d. siden') : t;
}
const fmtDate = iso => new Date(iso).toLocaleDateString('nb-NO', { day: 'numeric', month: 'short', year: 'numeric' });
function fmtDuration(min){
  if (min < 60) return min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  return (h === 1 ? '1 time' : h + ' timer') + (m ? ' og ' + m + ' min' : '');
}
function fmtHoursShort(min){
  if (min < 60) return min + ' min';
  return (min / 60).toLocaleString('nb-NO', { maximumFractionDigits: 1 }) + ' t';
}

/* ---------- Lagring: delt (db) eller lokal ---------- */
function localStore(){
  const KEY = 'krabbeligaen.v2';
  let data = null;
  try { data = JSON.parse(localStorage.getItem(KEY)); } catch (e) { data = null; }
  if (!data || !Array.isArray(data.players)) data = Object.assign(JSON.parse(JSON.stringify(DEMO)), { demo: true });
  data.rules = data.rules || [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };
  const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const push = () => setData(data.players, data.matches, data.crawls, data.rules);
  return {
    kind: 'local',
    start(){ push(); },
    async addPlayer(p){ data.players.push(p); save(); push(); },
    async updatePlayer(id, fields){ const p = data.players.find(x => x.id === id); if (p) Object.assign(p, fields); save(); push(); },
    async deletePlayer(id){ data.players = data.players.filter(p => p.id !== id); save(); push(); },
    async addMatch(m){ const id = uid('m'); data.matches.push(Object.assign({}, m, { id })); save(); push(); return id; },
    async addCrawl(c){ const id = uid('c'); data.crawls.push(Object.assign({}, c, { id })); save(); push(); return id; },
    async deleteMatch(id){ data.matches = data.matches.filter(m => m.id !== id); data.crawls = data.crawls.filter(c => c.matchId !== id); save(); push(); },
    async deleteCrawl(id){ data.crawls = data.crawls.filter(c => c.id !== id); save(); push(); },
    async addRule(r){ const id = uid('r'); data.rules.push(Object.assign({}, r, { id })); save(); push(); return id; },
    async updateRule(id, text){ const r = data.rules.find(x => x.id === id); if (r) r.text = text; save(); push(); },
    async deleteRule(id){ data.rules = data.rules.filter(r => r.id !== id); save(); push(); },
    async reset(){ data = { players: [], matches: [], crawls: [], rules: data.rules }; save(); push(); },
    isDemo(){ return !!data.demo; }
  };
}

function dbStore(db){
  const COLLS = ['players', 'matches', 'crawls', 'rules'];
  const cache = { players: null, matches: null, crawls: null, rules: null };
  return {
    kind: 'shared',
    start(){
      COLLS.forEach(c => {
        db.collection(c).onSnapshot(snap => {
          cache[c] = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
          if (COLLS.every(k => cache[k])){
            if (state.mode !== 'shared'){ state.mode = 'shared'; }
            setData(cache.players, cache.matches, cache.crawls, cache.rules);
          }
        }, err => {
          console.error('db', err);
          if (state.mode !== 'shared' || err.code === 'not_granted' || err.code === 'capability_disabled' || err.code === 'capability_removed') useLocal();
          else { state.mode = 'offline'; renderHeader(); }
        });
      });
    },
    async addPlayer(p){ const body = Object.assign({}, p); delete body.id; await db.collection('players').doc(p.id).set(body); },
    async updatePlayer(id, fields){ await db.doc('players/' + id).update(fields); },
    async deletePlayer(id){ await db.doc('players/' + id).delete(); },
    async addMatch(m){ const ref = await db.collection('matches').add(m); return ref.id; },
    async addCrawl(c){ const ref = await db.collection('crawls').add(c); return ref.id; },
    async deleteMatch(id){
      const linked = (cache.crawls || []).filter(c => c.matchId === id);
      await Promise.all([db.doc('matches/' + id).delete()].concat(linked.map(c => db.doc('crawls/' + c.id).delete())));
    },
    async deleteCrawl(id){ await db.doc('crawls/' + id).delete(); },
    async addRule(r){ const ref = await db.collection('rules').add(r); return ref.id; },
    async updateRule(id, text){ await db.doc('rules/' + id).update({ text }); },
    async deleteRule(id){ await db.doc('rules/' + id).delete(); },
    async reset(){
      const refs = [].concat(
        (cache.matches || []).map(m => 'matches/' + m.id),
        (cache.crawls || []).map(c => 'crawls/' + c.id),
        (cache.players || []).map(p => 'players/' + p.id));
      for (let i = 0; i < refs.length; i += 10) await Promise.all(refs.slice(i, i + 10).map(r => db.doc(r).delete()));
    },
    isDemo(){ return false; }
  };
}

/* ---------- Lagring: Google Sheets via Apps Script-API ---------- */
function gasStore(){
  const POLL_MS = 8000;
  const cache = { players: [], matches: [], crawls: [], rules: [] };
  let version = null, timer = null, busy = false;
  async function call(fn, ...args){
    const res = fn === 'getAll'
      ? await fetch(API_URL + (args[0] != null ? '?v=' + encodeURIComponent(args[0]) : ''))
      : await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) });
    const body = await res.json();
    if (!body.ok) throw new Error(body.error || 'Ukjent feil');
    return body.result;
  }
  function apply(res){
    if (!res) return;
    version = res.version;
    ['players', 'matches', 'crawls', 'rules'].forEach(c => { cache[c] = res[c] || []; });
    state.mode = 'shared';
    setData(cache.players, cache.matches, cache.crawls, cache.rules);
  }
  let again = false;
  async function refresh(force){
    if (busy){ if (force) again = true; return; }
    busy = true;
    try { apply(await call('getAll', force ? null : version)); }
    catch (err){ console.error('gas', err); state.mode = 'offline'; renderHeader(); }
    finally { busy = false; }
    if (again){ again = false; await refresh(true); }
  }
  const write = async p => { try { return await p; } finally { await refresh(true); } };
  return {
    kind: 'shared',
    start(){
      refresh(true);
      timer = setInterval(() => { if (!document.hidden) refresh(false); }, POLL_MS);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(false); });
    },
    addPlayer(p){ return write(call('setDoc', 'players', p.id, p)); },
    updatePlayer(id, fields){ return write(call('updateDoc', 'players', id, fields)); },
    deletePlayer(id){ return write(call('deleteDocs', ['players/' + id])); },
    addMatch(m){ return write(call('addDoc', 'matches', m)); },
    addCrawl(c){ return write(call('addDoc', 'crawls', c)); },
    deleteMatch(id){
      const linked = cache.crawls.filter(c => c.matchId === id).map(c => 'crawls/' + c.id);
      return write(call('deleteDocs', ['matches/' + id].concat(linked)));
    },
    deleteCrawl(id){ return write(call('deleteDocs', ['crawls/' + id])); },
    addRule(r){ return write(call('addDoc', 'rules', r)); },
    updateRule(id, text){ return write(call('updateDoc', 'rules', id, { text })); },
    deleteRule(id){ return write(call('deleteDocs', ['rules/' + id])); },
    reset(){
      const refs = [].concat(
        cache.matches.map(m => 'matches/' + m.id),
        cache.crawls.map(c => 'crawls/' + c.id),
        cache.players.map(p => 'players/' + p.id));
      return write(call('deleteDocs', refs));
    },
    isDemo(){ return false; }
  };
}

function setData(players, matches, crawls, rules){
  const byAt = (a, b) => a.at < b.at ? -1 : a.at > b.at ? 1 : 0;
  state.players = players.slice().sort((a, b) => a.name.localeCompare(b.name, 'nb'));
  state.matches = matches.slice().sort(byAt);
  state.crawls = crawls.slice().sort(byAt);
  state.rules = (rules || []).slice().sort(byAt);
  state.pmap = new Map(state.players.map(p => [p.id, p]));
  const ids = new Set(state.players.map(p => p.id));
  const pickable = new Set(state.players.filter(p => !p.archived).map(p => p.id));
  form.red = form.red.filter(id => pickable.has(id)); form.blue = form.blue.filter(id => pickable.has(id));
  Object.keys(rulesUi.drafts).forEach(id => { if (!state.rules.some(r => r.id === id)) delete rulesUi.drafts[id]; });
  Object.keys(playersUi.drafts).forEach(id => { if (!ids.has(id)) delete playersUi.drafts[id]; });
  if (!state.rules.length) rulesUi.editing = false;
  if (!state.players.length) playersUi.editing = false;
  state.derived = compute();
  if (!state.period.key || !state.derived.months.includes(state.period.key)) state.period.key = state.derived.nowKey;
  render();
}

/* ---------- Beregninger: rating, perioder, krabbing, fakta ---------- */
function expectedFor(m, rating){
  const get = id => rating.get(id) ?? START;
  const r1 = avg(m.t1.map(get)), r2 = avg(m.t2.map(get));
  const e1 = 1 / (1 + Math.pow(10, (r2 - r1) / 400));
  return { e1, pWin: m.winner === 1 ? e1 : 1 - e1 };
}
function longestRun(res, want){ let best = 0, n = 0; res.forEach(r => { n = r === want ? n + 1 : 0; if (n > best) best = n; }); return best; }

/* Rating regnes over hele historikken. Laget flytter like mange poeng som i vanlig lag-Elo,
   men fordelingen innad i laget følger hver spillers egen forventning mot motstandernes snitt:
   den med lavest rating får mest av en seier, den med høyest rating taper mest ved tap. */
function compute(){
  const rating = new Map();
  const get = id => rating.get(id) ?? START;
  const f = diff => 1 / (1 + Math.pow(10, -diff / 400));
  const annotated = [];
  for (const m of state.matches){
    const { e1, pWin } = expectedFor(m, rating);
    const w1 = m.winner === 1;
    const winners = w1 ? m.t1 : m.t2, losers = w1 ? m.t2 : m.t1;
    const winAvg = avg(winners.map(get)), loseAvg = avg(losers.map(get));
    const surprise = 1 - pWin;
    const wWeights = winners.map(id => 1 - f(get(id) - loseAvg));
    const lWeights = losers.map(id => f(get(id) - winAvg));
    const wSum = wWeights.reduce((a, b) => a + b, 0), lSum = lWeights.reduce((a, b) => a + b, 0);
    const deltas = {};
    winners.forEach((id, i) => { deltas[id] = K * surprise * winners.length * wWeights[i] / wSum; });
    losers.forEach((id, i) => { deltas[id] = -K * surprise * losers.length * lWeights[i] / lSum; });
    Object.keys(deltas).forEach(id => rating.set(id, get(id) + deltas[id]));
    annotated.push(Object.assign({}, m, { upset: pWin < UPSET_P, pWin, e1, deltas, month: monthKeyOf(m.at) }));
  }

  const nowKey = monthKeyOf(new Date());
  const keys = new Set([nowKey]);
  annotated.forEach(m => keys.add(m.month));
  state.crawls.forEach(c => keys.add(monthKeyOf(c.at)));
  const months = Array.from(keys).sort();

  const all = periodSummary(annotated, state.crawls, 'all');
  const cutoff = Date.now() - 7 * 864e5;
  const allBefore = periodSummary(annotated.filter(m => new Date(m.at).getTime() <= cutoff), [], 'all');
  applyTrend(all.ranked, allBefore.ranked);

  const byMonth = {};
  months.forEach(k => { byMonth[k] = periodSummary(annotated.filter(m => m.month === k), state.crawls.filter(c => monthKeyOf(c.at) === k), 'month'); });
  months.forEach((k, i) => applyTrend(byMonth[k].ranked, i > 0 ? byMonth[months[i - 1]].ranked : []));

  const weekStart = (() => { const d = new Date(); const day = (d.getDay() + 6) % 7; return new Date(d.getFullYear(), d.getMonth(), d.getDate() - day).getTime(); })();
  const thisWeek = annotated.filter(m => new Date(m.at).getTime() >= weekStart).length;

  const counts = new Map();
  const bump = (id, key) => { const c = counts.get(id) || { games: 0, crawls: 0 }; c[key]++; counts.set(id, c); };
  state.matches.forEach(m => [].concat(m.t1, m.t2).forEach(id => bump(id, 'games')));
  state.crawls.forEach(c => (c.players || []).forEach(id => bump(id, 'crawls')));

  return { rating, annotated, months, nowKey, all, byMonth, thisWeek, counts };
}

function periodSummary(ms, cs, mode){
  const stats = new Map();
  ms.forEach(m => {
    const w1 = m.winner === 1;
    [].concat(m.t1, m.t2).forEach(id => {
      const s = stats.get(id) || { w: 0, l: 0, res: [], points: 0 };
      const won = m.t1.includes(id) === w1;
      won ? s.w++ : s.l++; s.res.push(won); s.points += m.deltas[id] || 0; stats.set(id, s);
    });
  });
  const rows = state.players.map(p => {
    const s = stats.get(p.id) || { w: 0, l: 0, res: [], points: 0 };
    return { id: p.id, name: p.name, archived: !!p.archived, w: s.w, l: s.l, games: s.w + s.l, res: s.res, points: s.points, rating: START + s.points };
  }).filter(r => !r.archived || r.games > 0);
  const score = r => mode === 'all' ? r.rating : r.points;
  const ranked = rows.filter(r => r.games >= MIN_RANKED)
    .sort((a, b) => score(b) - score(a) || (b.w / b.games) - (a.w / a.games) || b.w - a.w || a.name.localeCompare(b.name, 'nb'));
  ranked.forEach((r, i) => { r.pos = i + 1; });

  // Krabbing i perioden
  const crawlBy = new Map();
  let crawlTotal = 0;
  cs.forEach(c => (c.players || []).forEach(id => { const x = crawlBy.get(id) || { n: 0, last: null }; x.n++; x.last = c.at; crawlBy.set(id, x); crawlTotal++; }));
  // Sendt under bordet: vinnerne får ett poeng for hver taper som krabbet etter kampen
  const matchById = new Map(state.matches.map(m => [m.id, m]));
  const sentBy = new Map();
  cs.forEach(c => {
    const m = c.matchId && matchById.get(c.matchId); if (!m) return;
    const winners = m.winner === 1 ? m.t1 : m.t2, losers = m.winner === 1 ? m.t2 : m.t1;
    const n = (c.players || []).filter(id => losers.includes(id)).length;
    if (n) winners.forEach(id => sentBy.set(id, (sentBy.get(id) || 0) + n));
  });
  const crawlRows = state.players.map(p => ({ id: p.id, name: p.name, archived: !!p.archived, n: (crawlBy.get(p.id) || {}).n || 0, sent: sentBy.get(p.id) || 0, last: (crawlBy.get(p.id) || {}).last || null }))
    .filter(r => !r.archived || r.n > 0 || r.sent > 0)
    .sort((a, b) => b.n - a.n || (b.last || '').localeCompare(a.last || '') || a.name.localeCompare(b.name, 'nb'));
  const lastCrawl = cs.length ? cs[cs.length - 1] : null;

  // Fakta
  const facts = [];
  let bestWin = null, bestLoss = null;
  rows.forEach(r => {
    const w = longestRun(r.res, true), l = longestRun(r.res, false);
    if (w >= 3 && (!bestWin || w > bestWin.n)) bestWin = { name: r.name, n: w };
    if (l >= 3 && (!bestLoss || l > bestLoss.n)) bestLoss = { name: r.name, n: l };
  });
  const maxGames = Math.max(0, ...rows.map(r => r.games));
  const mostActive = rows.filter(r => r.games === maxGames && maxGames > 0).map(r => r.name);
  if (ms.length){
    facts.push(['Seiersrekke', bestWin ? `${bestWin.name} vant ${bestWin.n} kamper på rad.` : 'Ingen vant tre på rad.']);
    facts.push(['Flest tap på rad', bestLoss ? `${bestLoss.name} tapte ${bestLoss.n} kamper på rad. Bordet er tålmodig.` : 'Ingen tapte tre på rad. Imponerende.']);
    facts.push(['Mest aktiv', `${joinNames(mostActive)} spilte ${maxGames} ${maxGames === 1 ? 'kamp' : 'kamper'} – flest av alle.`]);
    facts.push(['Tid ved bordet', `${ms.length} kamper à ${MATCH_MINUTES} minutter er ${fmtDuration(ms.length * MATCH_MINUTES)} til sammen.`]);
    const pairs = {};
    ms.forEach(m => { const a = m.t1.slice().sort().join('+'), b = m.t2.slice().sort().join('+'); const k = [a, b].sort().join('|'); const p = pairs[k] || { n: 0, wins: {}, a, b }; p.n++; const w = m.winner === 1 ? a : b; p.wins[w] = (p.wins[w] || 0) + 1; pairs[k] = p; });
    const rival = Object.values(pairs).sort((x, y) => y.n - x.n)[0];
    if (rival && rival.n >= 3){
      const wx = rival.wins[rival.a] || 0, wy = rival.wins[rival.b] || 0;
      const lead = wx >= wy ? [rival.a, wx, rival.b, wy] : [rival.b, wy, rival.a, wx];
      facts.push(['Rivalisering', `${names(lead[0].split('+'))} leder ${lead[1]}–${lead[3]} mot ${names(lead[2].split('+'))} etter ${rival.n} oppgjør.`]);
    }
  }
  // Lagkjemi: par som vinner mer enn ratingene tilsier
  const pairs = {};
  ms.forEach(m => {
    [[m.t1, 1], [m.t2, 2]].forEach(([team, side]) => {
      if (!team || team.length !== 2) return;
      const key = team.slice().sort().join('+');
      const exp = side === 1 ? m.e1 : 1 - m.e1;
      const p = pairs[key] || { key, n: 0, w: 0, exp: 0 };
      p.n++; p.w += (m.winner === side ? 1 : 0); p.exp += exp; pairs[key] = p;
    });
  });
  const chemistry = Object.values(pairs).filter(p => p.n >= 3)
    .map(p => ({ key: p.key, n: p.n, actualPct: 100 * p.w / p.n, expPct: 100 * p.exp / p.n, diff: 100 * (p.w - p.exp) / p.n }))
    .sort((a, b) => b.diff - a.diff);

  return {
    mode, matches: ms.length, rows, ranked, chemistry, active: rows.filter(r => r.games > 0).length,
    minutes: ms.length * MATCH_MINUTES, crawlRows, crawlTotal, lastCrawl, facts,
    winner: ranked[0] || null, crawler: crawlRows[0] && crawlRows[0].n > 0 ? crawlRows[0] : null
  };
}
function applyTrend(ranked, prevRanked){
  const prevPos = new Map(prevRanked.map(r => [r.id, r.pos]));
  ranked.forEach(r => { r.prev = prevPos.get(r.id) || null; });
}
const titleFor = n => TITLES.reduce((t, [min, name]) => n >= min ? name : t, TITLES[0][1]);

/* ---------- Rendering ---------- */
function render(){ renderHeader(); renderTabs(); renderScreen(); }

function renderHeader(){
  const d = state.derived;
  const pill = $('#modePill');
  const modes = { connecting: ['Kobler til', 'is-connecting'], shared: ['Delt lagring', 'is-shared'], local: ['Kun denne enheten', 'is-local'], offline: ['Mistet forbindelsen', 'is-offline'] };
  const [txt, cls] = modes[state.mode] || modes.connecting;
  pill.textContent = txt; pill.className = 'mode ' + cls;
  $('#hdrStats').innerHTML = d ? `${state.matches.length} kamper · ${d.all.crawlTotal} krabbinger` : '&nbsp;';
}
function renderTabs(){
  document.querySelectorAll('#tabs [role="tab"]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.screen === state.screen)));
}
function renderScreen(){
  const v = $('#view');
  const typedRule = $('#newRuleText') ? $('#newRuleText').value : '';
  const ae = document.activeElement;
  const keepFocus = ae && ae.dataset && ae.dataset.edit
    ? { key: ae.dataset.edit, start: ae.selectionStart, end: ae.selectionEnd } : null;
  if (state.screen === 'register') v.innerHTML = viewRegister();
  else if (state.screen === 'table') v.innerHTML = viewTable();
  else if (state.screen === 'players') v.innerHTML = viewPlayers();
  else if (state.screen === 'rules') v.innerHTML = viewRules();
  else v.innerHTML = viewHistory();
  const nr = $('#newRuleText'); if (nr && typedRule) nr.value = typedRule;
  if (keepFocus){
    const t = $('[data-edit="' + keepFocus.key + '"]');
    if (t){ t.focus(); try { t.setSelectionRange(keepFocus.start, keepFocus.end); } catch (e) {} }
  }
  growTextareas();
}
function grow(t){ t.style.height = 'auto'; t.style.height = Math.max(76, t.scrollHeight) + 'px'; }
function growTextareas(){ document.querySelectorAll('.rule-edit textarea, .newrule textarea').forEach(grow); }

function demoNote(){
  if (!store || !store.isDemo()) return '';
  return `<div class="demo-note"><span>Dette er eksempeldata som bare ligger på denne enheten.</span><button class="link quiet" data-act="reset">Start på nytt uten eksempler</button></div>`;

  const bank = state.players.filter(p => !p.archived).sort((a, b) => (recent.get(b.id) || 0) - (recent.get(a.id) || 0) || a.name.localeCompare(b.name, 'nb'));

    const cls = form.red.includes(p.id) ? ' is-a' : form.blue.includes(p.id) ? ' is-b' : '';

  }).join('');
  const team = (n, ids, cls, label) => `
    <button class="team ${cls}${form.winner === n ? ' is-winner' : ''}" data-act="team" data-team="${n}" aria-pressed="${form.winner === n}">
