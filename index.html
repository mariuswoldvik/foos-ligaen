      <span class="team-label">${label}</span>
      <span class="team-names${ids.length ? '' : ' empty'}">${ids.length ? esc(names(ids)) : 'Velg spillere over'}</span>
      ${form.winner === n ? '<span class="won-badge">Vant</span>' : ''}
    </button>`;
  const teamsOk = form.red.length && form.blue.length;
  let btn = 'Registrer kamp', disabled = false;
  if (!ready){ btn = state.mode === 'offline' ? 'Mistet forbindelsen – last siden på nytt' : 'Kobler til delt lagring …'; disabled = true; }
  else if (!teamsOk){ btn = 'Velg spillere på begge lag'; disabled = true; }
  else if (!form.winner){ btn = 'Hvem vant? Trykk på laget'; disabled = true; }
  const last = (d ? d.annotated.slice(-3).reverse() : []);
  return `
    ${demoNote()}
    <section class="card">
      <div class="card-head"><div><h2>Registrer kamp</h2><p class="lede-sm">Best av tre sett til 6. Velg spillere, trykk på laget som vant, og send inn.</p></div></div>
      <div class="block">
        <div class="block-head"><h3>Hvem spilte?</h3>
          ${bank.length ? `<button class="ptoggle" data-act="goto" data-screen="players">Spillere</button>` : ''}
        </div>
        <p class="hint">Trykk én gang for svart lag, to for hvitt, tre for å fjerne.</p>
        ${bank.length ? `<div class="chips">${chips}</div>` : `<div class="empty">Ingen spillere i lista enda.<br><button class="link" data-act="goto" data-screen="players" style="margin-top:8px">Legg dem til under Spillere</button></div>`}
      </div>
      <div class="block">
        <div class="block-head"><h3>Hvem vant?</h3></div>
        <div class="teams">${team(1, form.red, 'team-a', 'Svart lag')}${team(2, form.blue, 'team-b', 'Hvitt lag')}</div>
        <p class="hint center">Trykk på laget som vant.</p>
      </div>
      <button class="primary" id="saveBtn" data-act="save" ${disabled ? 'disabled' : ''}>${btn}</button>
    </section>
    <section class="card">
      <div class="block">
        <div class="block-head"><h2>Siste kamper</h2><button class="link" data-act="goto" data-screen="history">Se alle</button></div>
        ${last.length ? `<ul class="matchlist compact">${last.map(matchRow).join('')}</ul>` : `<div class="empty">Ingen kamper registrert enda. Den første blir historisk.</div>`}
        <div><button class="link quiet" data-act="crawlonly">Registrer krabbing uten kamp</button></div>
      </div>
    </section>`;
}

function matchRow(m){
  const crawl = state.crawls.filter(c => c.matchId === m.id);
  const tags = [];
  if (crawl.length){
    // Samme spiller kan krabbe flere ganger i én kamp – vis antall
    const n = new Map();
    crawl.forEach(c => (c.players || []).forEach(id => n.set(id, (n.get(id) || 0) + 1)));
    const txt = Array.from(n, ([id, k]) => nameOf(id) + (k > 1 ? ' ×' + k : '')).join(' & ');
    tags.push(`<span class="tag crawl">Krabbet: ${esc(txt)}</span>`);
  }
  if (m.upset) tags.push('<span class="tag upset">Sensasjon</span>');
  tags.push(`<button class="tag add" data-act="crawlextra" data-id="${esc(m.id)}">+ Krabbing</button>`);
  const confirming = confirmKey === 'm:' + m.id;
  const w1 = m.winner === 1;
  const winIds = w1 ? m.t1 : m.t2, loseIds = w1 ? m.t2 : m.t1;
  const winDot = w1 ? 'a' : 'b', loseDot = w1 ? 'b' : 'a';
  return `<li class="match">
    <span class="time">${fmtTime(m.at)}</span>
    <div>
      <div class="sides">
        <span class="side left won"><i class="dot dot-${winDot}"></i><span class="nm">${esc(names(winIds))}</span></span>
        <span class="score word">vasket</span>
        <span class="side right"><span class="nm">${esc(names(loseIds))}</span><i class="dot dot-${loseDot}"></i></span>
      </div>
      <div class="tags">${tags.join('')}</div>
    </div>
    <button class="del${confirming ? ' confirm' : ''}" data-act="del" data-kind="match" data-id="${esc(m.id)}" aria-label="Slett kamp">${confirming ? 'Slett?' : '×'}</button>
  </li>`;
}
function crawlRow(c){
  const confirming = confirmKey === 'c:' + c.id;
  return `<li class="match crawlrow">
    <span class="time">${fmtTime(c.at)}</span>
    <div class="sides"><span class="tag crawl">Krabbing</span> <b>${esc(names(c.players))}</b> <span class="hint">uten kamp</span></div>
    <button class="del${confirming ? ' confirm' : ''}" data-act="del" data-kind="crawl" data-id="${esc(c.id)}" aria-label="Slett krabbing">${confirming ? 'Slett?' : '×'}</button>
  </li>`;
}

const fmtPoints = p => { const r = Math.round(p); return r > 0 ? '+' + r : r < 0 ? '−' + Math.abs(r) : '0'; };

function periodBar(d){
  const all = state.period.all, key = state.period.key;
  const idx = d.months.indexOf(key);
  const per = all ? d.all : d.byMonth[key];
  const first = state.matches.length ? fmtDate(state.matches[0].at) : null;
  const label = all ? 'Totalt' : monthLabel(key);
  const sub = all ? (first ? `siden ${first}` : 'alle kamper') : `${per.matches} ${per.matches === 1 ? 'kamp' : 'kamper'}${key === d.nowKey ? ' · pågår' : ''}`;
  return `<div class="period">
    <button class="pbtn" data-act="pprev" aria-label="Forrige måned" ${all || idx <= 0 ? 'disabled' : ''}>‹</button>
    <div class="plabel"><b>${esc(label)}</b><small>${esc(sub)}</small></div>
    <button class="pbtn" data-act="pnext" aria-label="Neste måned" ${all || idx >= d.months.length - 1 ? 'disabled' : ''}>›</button>
    <button class="ptoggle${all ? ' on' : ''}" data-act="pall" aria-pressed="${all}">${all ? 'Måned' : 'Totalt'}</button>
  </div>`;
}

function viewTable(){
  const d = state.derived;
  if (!d) return '<section class="card"><div class="empty">Kobler til …</div></section>';
  const all = state.period.all, key = state.period.key;
  const per = all ? d.all : d.byMonth[key];
  const inPeriod = all ? 'totalt' : 'i ' + monthName(key);
  const seg = `<div class="seg-wide" role="tablist">
    <button role="tab" data-act="tabletab" data-tab="matches" class="${state.tableTab === 'matches' ? 'on' : ''}" aria-selected="${state.tableTab === 'matches'}">Kamper</button>
    <button role="tab" data-act="tabletab" data-tab="crawls" class="${state.tableTab === 'crawls' ? 'on' : ''}" aria-selected="${state.tableTab === 'crawls'}">Krabbing</button>
  </div>`;
  const head = periodBar(d) + seg;
  if (state.tableTab === 'crawls') return demoNote() + viewCrawls(d, per, head, inPeriod);

  const stats = `<div class="stats">
    <div class="stat"><span class="stat-n">${per.matches}</span><span class="stat-l">kamper ${inPeriod}</span></div>
    <div class="stat"><span class="stat-n">${per.active}</span><span class="stat-l">aktive spillere</span></div>
    <div class="stat"><span class="stat-n">${per.minutes ? fmtHoursShort(per.minutes) : '–'}</span><span class="stat-l">ved bordet (${MATCH_MINUTES} min per kamp)</span></div>
    <div class="stat"><span class="stat-n">${per.crawlTotal}</span><span class="stat-l">krabbinger</span></div>
  </div>`;
  const rows = per.ranked.map(r => {
    const trend = r.prev === null ? '<span class="trend new">ny</span>' : r.prev > r.pos ? `<span class="trend up">▲${r.prev - r.pos}</span>` : r.prev < r.pos ? `<span class="trend">▼${r.pos - r.prev}</span>` : '';
    const formDots = r.res.slice(-5).map(w => `<i class="${w ? 'w' : ''}"></i>`).join('');
    const main = all ? Math.round(r.rating) : `<span class="pts ${r.points > 0.5 ? 'pos' : r.points < -0.5 ? 'neg' : ''}">${fmtPoints(r.points)}</span>`;
    return `<tr>
      <td class="pos"><b>${r.pos}</b>${trend}</td>
      <td class="name"><span class="av-name">${avatarFor(r.id, 30)}<span class="txt">${esc(r.name)}</span></span></td>
      <td class="rating r">${main}</td>
      <td class="rec r">${r.w}–${r.l}<small>${Math.round(100 * r.w / r.games)} %</small></td>
      <td class="r"><span class="form" aria-label="Siste fem kamper">${formDots}</span></td>
    </tr>`;
  }).join('');
  const foot = all
    ? `Alle starter på 1000 i rating. Slår du noen som er bedre enn deg, får du mer – taper du mot noen dårligere, mister du mer. I lagkamper fordeles poengene innad i laget: den med høyest rating taper mest ved tap, og den med lavest får mest ved seier. Pilene viser endring siden forrige uke. Minst ${MIN_RANKED} kamper for å komme på tabellen.`
    : `Poeng er hvor mye ratingen har flyttet seg ${inPeriod}. Alle starter måneden på null, og du får mer for å slå noen som er bedre enn deg. Pilene viser plassering i forhold til forrige måned. Minst ${MIN_RANKED} kamper i måneden for å komme på tabellen.`;
  const table = per.ranked.length ? `<div style="overflow-x:auto"><table class="rank">
    <thead><tr><th>#</th><th>Spiller</th><th class="r">${all ? 'Rating' : 'Poeng'}</th><th class="r">S–T</th><th class="r">Form</th></tr></thead>
    <tbody>${rows}</tbody></table></div><p class="foot">${foot}</p>`
    : `<div class="empty">${per.matches ? `Ingen har spilt ${MIN_RANKED} kamper ${inPeriod} enda.` : `Ingen kamper ${inPeriod} enda.`}</div>`;

  const hall = all ? hallOfFame(d) : '';
  const newc = per.rows.filter(r => r.games < MIN_RANKED);
  const newcomers = newc.length && per.matches ? `<section class="card"><div class="block"><div class="block-head"><h2>På vei inn</h2></div>
    <div class="newcomers">${newc.map(r => `<span><b>${esc(r.name)}</b> · ${r.games === 0 ? `ikke spilt ${inPeriod}` : r.games + (r.games === 1 ? ' kamp' : ' kamper')}</span>`).join('')}</div></div></section>` : '';
  const facts = per.facts.length ? `<section class="card"><div class="block"><div class="block-head"><h2>Fakta ${all ? 'totalt' : 'fra ' + monthName(key)}</h2></div>
    <ul class="facts">${per.facts.map(([l, v]) => `<li><span class="fact-l">${esc(l)}</span><span>${esc(v)}</span></li>`).join('')}</ul></div></section>` : '';
  const chem = per.chemistry.length ? `<section class="card"><div class="block">
    <div class="block-head"><h2>Lagkjemi</h2></div>
    <p class="hint">Par som har spilt minst tre kamper sammen ${inPeriod}, og hvor mye de vinner i forhold til det ratingene skulle tilsi.</p>
    <ul class="chem">${per.chemistry.slice(0, 5).map(c => `<li>
      <div><span class="pair">${esc(names(c.key.split('+')))}</span>
        <div class="det">${c.n} kamper · vinner ${Math.round(c.actualPct)} % mot ${Math.round(c.expPct)} % ventet</div>
        <div class="bar"><i style="width:${Math.max(3, Math.min(100, Math.round(c.actualPct)))}%"></i></div></div>
      <span class="dx ${c.diff > 1 ? 'pos' : c.diff < -1 ? 'neg' : ''}">${c.diff > 0 ? '+' : c.diff < 0 ? '\u2212' : ''}${Math.abs(Math.round(c.diff))}</span>
    </li>`).join('')}</ul></div></section>` : '';
  return demoNote() + `<section class="card">${head}${stats}${table}</section>` + hall + chem + newcomers + facts;
}

function hallOfFame(d){
  const rows = d.months.slice().reverse().filter(k => d.byMonth[k].matches > 0).map(k => {
    const p = d.byMonth[k];
    const win = p.winner ? `<b>${esc(p.winner.name)}</b> ${fmtPoints(p.winner.points)}` : `<span class="hint">ingen på tabellen enda</span>`;
    const crawl = p.crawler ? `${esc(p.crawler.name)} (${p.crawler.n})` : 'ingen';
    return `<li><span class="fact-l">${esc(monthLabel(k, true))}${k === d.nowKey ? '<br>pågår' : ''}</span><span>${win}<br><span class="hint">Månedens krabber: ${crawl}</span></span></li>`;
  });
  if (!rows.length) return '';
  return `<section class="card"><div class="block"><div class="block-head"><h2>Månedens vinnere</h2></div>
    <ul class="facts hall">${rows.join('')}</ul>
    <p class="foot">Vinneren er den som har vunnet flest poeng i måneden. Måneden som pågår kan fortsatt snu.</p></div></section>`;
}

function viewCrawls(d, per, head, inPeriod){
  const all = state.period.all;
  const rows = per.crawlRows.filter(r => r.n > 0);
  const top = rows.slice(0, 3);
  const last = per.lastCrawl;
  const allBy = new Map(d.all.crawlRows.map(r => [r.id, r.n]));
  const hero = `<div class="crawl-hero">
    <span class="big">${per.crawlTotal}</span>
    <span class="lbl">${per.crawlTotal === 1 ? 'krabbing' : 'krabbinger'} under bordet ${inPeriod}</span>
    <span class="sub">${last ? `Sist ${daysAgoText(last.at)}: ${esc(names(last.players))}` : (all ? 'Ingen har krabbet enda. Bordet venter.' : `Ingen har krabbet ${inPeriod}.`)}</span>
  </div>`;
  const podium = top.length >= 2 ? `<div class="stage"><ol class="podium">${top.map((r, i) => `<li class="p${i + 1}">
      ${avatarFor(r.id, i === 0 ? 60 : 50)}
      <span class="who">${esc(r.name)}</span>
      <span class="ttl">${all ? titleFor(r.n) : `${allBy.get(r.id) || 0} totalt`}</span>
      <div class="box"><span class="rank">${i + 1}</span><b>${r.n}</b><small>${r.n === 1 ? 'gang' : 'ganger'}</small></div>
    </li>`).join('')}</ol><div class="floor"></div><p class="floor-lbl">Gulvet under bordet</p></div>` : '';
  const table = rows.length ? `<div style="overflow-x:auto"><table class="rank crawl">
    <thead><tr><th>#</th><th>Spiller</th><th class="r">Antall</th><th class="r">Sist</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr><td class="pos"><b>${i + 1}</b></td><td class="name"><span class="av-name">${avatarFor(r.id, 30)}<span class="txt">${esc(r.name)}<small>${all ? titleFor(r.n) : `${allBy.get(r.id) || 0} totalt`}</small></span></span></td><td class="count r">${r.n}</td><td class="last r">${r.last ? daysAgoShort(r.last) : ''}</td></tr>`).join('')}</tbody></table></div>`
    : '';
  const senders = per.crawlRows.filter(r => r.sent > 0).sort((a, b) => b.sent - a.sent || a.name.localeCompare(b.name, 'nb'));
  const sent = senders.length ? `<section class="card"><div class="block"><div class="block-head"><h2>Sendt under bordet ${inPeriod}</h2></div>
    <p class="hint">Du får ett poeng for hver motstander som må krabbe etter at du har vunnet.</p>
    <div style="overflow-x:auto"><table class="rank crawl">
    <thead><tr><th>#</th><th>Spiller</th><th class="r">Sendt</th></tr></thead>
    <tbody>${senders.map((r, i) => `<tr><td class="pos"><b>${i + 1}</b></td><td class="name"><span class="av-name">${avatarFor(r.id, 30)}<span class="txt">${esc(r.name)}</span></span></td><td class="count r">${r.sent}</td></tr>`).join('')}</tbody></table></div></div></section>` : '';
  const clean = per.crawlRows.filter(r => r.n === 0);
  const titles = `<p class="foot">Titler (totalt): ${TITLES.slice(1).map(([n, t]) => `${t} fra ${n}`).join(' · ')}.</p>`;
  const untouched = clean.length ? `<section class="card"><div class="block"><div class="block-head"><h2>Rent rulleblad ${inPeriod}</h2></div><div class="newcomers">${clean.map(r => `<span><b>${esc(r.name)}</b></span>`).join('')}</div>${titles}</div></section>` : '';
  return `<section class="card">${head}${hero}${podium}${table}${clean.length ? '' : titles}</section>` + sent + untouched;
}

function viewHistory(){
  const d = state.derived;
  if (!d) return '<section class="card"><div class="empty">Kobler til …</div></section>';
  const items = [].concat(
    d.annotated.map(m => ({ t: m.at, kind: 'match', m })),
    state.crawls.filter(c => !c.matchId).map(c => ({ t: c.at, kind: 'crawl', c }))
  ).sort((a, b) => b.t.localeCompare(a.t));
  if (!items.length) return demoNote() + '<section class="card"><div class="empty">Historikken er tom. Gå til Registrer og legg inn den første kampen.</div></section>' + resetBlock();
  const groups = [];
  items.forEach(it => { const k = dayKey(it.t); const g = groups[groups.length - 1]; if (g && g.k === k) g.items.push(it); else groups.push({ k, month: monthKeyOf(it.t), label: dayLabel(it.t), items: [it] }); });
  let lastMonth = null;
  const html = groups.map(g => {
    const mh = g.month !== lastMonth ? `<h2 class="month-h">${esc(monthLabel(g.month))}</h2>` : '';
    lastMonth = g.month;
    return mh + `<section class="card"><h2 class="day-h">${esc(g.label)}</h2><ul class="matchlist">${g.items.map(it => it.kind === 'match' ? matchRow(it.m) : crawlRow(it.c)).join('')}</ul></section>`;
  }).join('');
  return demoNote() + html + resetBlock();
}
function resetBlock(){
  const ready = state.mode === 'shared' || state.mode === 'local';
  if (!ready) return '';
  const confirming = confirmKey === 'reset';
  return `<section class="block" style="padding:6px 4px 0"><p class="hint">Vil dere starte med blanke ark? Dette sletter alle kamper, krabbinger og spillere${state.mode === 'shared' ? ' for alle' : ' på denne enheten'}. Husreglene beholdes.</p>
    <div><button class="link danger" data-act="reset">${confirming ? 'Er du sikker? Trykk igjen for å slette alt' : 'Nullstill ligaen'}</button></div></section>`;
}

function wardrobeCurrent(){
  const p = playerOf(wardrobe.id);
  if (!p) return null;
  return wardrobe.draft || avatarOf(p);
}
function saveWardrobe(){
  clearTimeout(wardrobeTimer);
  const id = wardrobe.id, draft = wardrobe.draft;
  if (!id || !draft || !store) return;
  wardrobeTimer = setTimeout(async () => {
    try { await store.updatePlayer(id, { avatar: draft }); }
    catch (e){ console.error(e); toast('Kunne ikke lagre figuren.'); }
  }, 500);
}
function setWardrobe(patch){
  const cur = wardrobeCurrent();
  if (!cur) return;
  wardrobe.draft = Object.assign({}, cur, patch);
  renderScreen();
  saveWardrobe();
}

function viewWardrobe(seg){
  const ready = state.mode === 'shared' || state.mode === 'local';
  const d = state.derived;
  const list = state.players.filter(p => !p.archived).sort((a, b) => a.name.localeCompare(b.name, 'nb'));
  if (!list.length) return `<section class="card">${seg}
    <div class="card-head"><div><h2>Garderobe</h2><p class="lede-sm">Lag din egen figur.</p></div></div>
    <div class="empty">Legg til spillere i lista først, så kan de kle seg opp.</div></section>`;
  if (!wardrobe.id || !list.some(p => p.id === wardrobe.id)){ wardrobe.id = list[0].id; wardrobe.draft = null; }
  const me = playerOf(wardrobe.id);
  const cur = wardrobeCurrent();
  const c = (d && d.counts.get(wardrobe.id)) || { games: 0, crawls: 0 };

  const pick = list.map(x => `<button class="chip chip-av${x.id === wardrobe.id ? ' is-on' : ''}" data-act="wrpick" data-id="${esc(x.id)}" aria-pressed="${x.id === wardrobe.id}">${avatarSvg(x.id === wardrobe.id ? cur : avatarOf(x), 26)}${esc(x.name)}</button>`).join('');
  const items = (key, arr) => arr.map(v => `<button class="wr-opt${cur[key] === v ? ' on' : ''}" data-act="wrset" data-key="${key}" data-val="${esc(v)}" aria-label="${esc(AV_LABELS[v] || v)}" title="${esc(AV_LABELS[v] || v)}">${avatarSvg(Object.assign({}, cur, { [key]: v }), 56, AV_VIEW[key])}</button>`).join('');
  const colors = key => AV_COLORS.map(v => `<button class="wr-sw${cur[key] === v ? ' on' : ''}" style="background:${v}" data-act="wrset" data-key="${key}" data-val="${esc(v)}" aria-label="Farge ${esc(v)}"></button>`).join('');
  const group = (title, inner) => `<div class="wr-group"><h3>${title}</h3><div class="wr-row">${inner}</div></div>`;

  return `
    <section class="card">${seg}
      <div class="card-head"><div><h2>Garderobe</h2><p class="lede-sm">Bygg figuren din. Den dukker opp ved siden av navnet ditt i tabellen og på krabbelista.</p></div></div>
      <div class="wr-pick chips">${pick}</div>
      <div class="wr-stage">
        ${avatarSvg(cur, 150)}
        <span class="who">${esc(me.name)}</span>
        <span class="sub">${c.games ? `${c.games} ${c.games === 1 ? 'kamp' : 'kamper'}${c.crawls ? ` · ${c.crawls} ${c.crawls === 1 ? 'krabbing' : 'krabbinger'}` : ''}` : 'ingen kamper enda'}</span>
        <div class="wr-actions">
          <button class="secondary" data-act="wrrandom" ${ready ? '' : 'disabled'}>Tilfeldig</button>
          <button class="secondary" data-act="wrreset" ${ready ? '' : 'disabled'}>Nullstill</button>
        </div>
      </div>
      ${group('Kroppsfarge', colors('body'))}
      ${group('Hatt', items('hat', AV_HATS))}
      ${group('Hattefarge', colors('hatColor'))}
      ${group('Briller', items('glasses', AV_GLASSES))}
      ${group('Antrekk', items('outfit', AV_OUTFITS))}
      ${group('Antrekksfarge', colors('outfitColor'))}
      ${group('Uttrykk', items('face', AV_FACES))}
      <p class="foot">Endringene lagres av seg selv, og alle på kontoret ser dem.</p>
    </section>`;
}

function viewRules(){
  const ready = state.mode === 'shared' || state.mode === 'local';
  const editing = rulesUi.editing;
  const list = state.rules.map((r, i) => {
    if (!editing) return `<li class="rule"><span class="rule-n">${i + 1}</span><span class="rule-t">${esc(r.text)}</span></li>`;
    const confirming = confirmKey === 'r:' + r.id;
    const val = rulesUi.drafts[r.id] !== undefined ? rulesUi.drafts[r.id] : r.text;
    return `<li class="rule">
      <span class="rule-n">${i + 1}</span>
      <div class="rule-edit">
        <textarea data-edit="rule:${esc(r.id)}" maxlength="5000" aria-label="Regel ${i + 1}">${esc(val)}</textarea>
        <button class="mini danger${confirming ? ' confirm' : ''}" data-act="del" data-kind="rule" data-id="${esc(r.id)}">${confirming ? 'Slett regelen?' : 'Slett'}</button>
      </div></li>`;
  }).join('');
  const toggle = state.rules.length && ready
    ? `<button class="ptoggle${editing ? ' on' : ''}" data-act="${editing ? 'ruledone' : 'ruleedit'}">${editing ? 'Ferdig' : 'Rediger'}</button>` : '';
  const lede = editing
    ? 'Skriv rett i teksten for å rette opp. Endringene lagres når du går videre, og alle ser dem.'
    : 'Reglene som gjelder ved dette bordet. Alle ser det samme.';
  return `
    ${demoNote()}
    <section class="card">
      <div class="card-head"><div><h2>Husregler</h2><p class="lede-sm">${lede}</p></div>${toggle}</div>
      ${state.rules.length ? `<ol class="rules">${list}</ol>` : `<div class="empty">Ingen regler enda. Den første pleier å handle om krabbing.</div>`}
      ${editing ? '' : `<form class="newrule" id="newRuleForm">
        <div class="block-head"><h3>Ny regel</h3></div>
        <textarea id="newRuleText" placeholder="Skriv regelen slik dere sier den ved bordet" maxlength="5000" required ${ready ? '' : 'disabled'}></textarea>
        <button type="submit" class="primary" ${ready ? '' : 'disabled'}>${ready ? 'Legg til regel' : 'Kobler til …'}</button>
      </form>`}
    </section>`;
}

function viewPlayers(){
  const ready = state.mode === 'shared' || state.mode === 'local';
  const d = state.derived;
  const editing = playersUi.editing;
  const counts = d ? d.counts : new Map();
  const sorted = state.players.slice().sort((a, b) => a.name.localeCompare(b.name, 'nb'));
  const active = sorted.filter(p => !p.archived);
  const gone = sorted.filter(p => p.archived);
  const meta = id => {
    const c = counts.get(id) || { games: 0, crawls: 0 };
    if (!c.games) return 'ingen kamper';
    return `${c.games} ${c.games === 1 ? 'kamp' : 'kamper'}${c.crawls ? ` · ${c.crawls} krabb.` : ''}`;
  };
  const row = p => {
    if (!editing) return `<li class="prow">${avatarSvg(avatarOf(p), 34)}<span class="pname">${esc(p.name)}</span><span class="pmeta">${meta(p.id)}</span></li>`;
    const confirming = confirmKey === 'p:' + p.id;
    const c = counts.get(p.id) || { games: 0, crawls: 0 };
    const used = c.games > 0 || c.crawls > 0;
    const val = playersUi.drafts[p.id] !== undefined ? playersUi.drafts[p.id] : p.name;
    return `<li class="prow">
      <input data-edit="player:${esc(p.id)}" value="${esc(val)}" maxlength="24" autocomplete="off" aria-label="Navn på ${esc(p.name)}">
      <button class="mini danger${confirming ? ' confirm' : ''}" data-act="delplayer" data-id="${esc(p.id)}">${confirming ? (used ? 'Ta ut?' : 'Slett?') : 'Fjern'}</button>
    </li>`;
  };
  const toggle = state.players.length && ready
    ? `<button class="ptoggle${editing ? ' on' : ''}" data-act="${editing ? 'playerdone' : 'playeredit'}">${editing ? 'Ferdig' : 'Rediger'}</button>` : '';
  const lede = editing
    ? 'Skriv rett i navnet for å rette det opp. Har noen spilt kamper, blir de stående i historikken selv om du fjerner dem fra lista.'
    : 'Alle som kan velges når dere registrerer en kamp.';
  const goneList = gone.length ? `<div class="block">
      <div class="block-head"><h3>Ute av lista</h3></div>
      <ul class="plist">${gone.map(p => `<li class="prow gone">
        <span class="pname">${esc(p.name)}</span>
        ${editing ? `<button class="mini go" data-act="unarchive" data-id="${esc(p.id)}">Hent tilbake</button>` : `<span class="pmeta">${meta(p.id)}</span>`}
      </li>`).join('')}</ul>
      <p class="hint">De står fortsatt i historikken og i tabellene for månedene de spilte.</p>
    </div>` : '';
  const seg = `<div class="seg-wide" role="tablist">
    <button role="tab" data-act="playerstab" data-tab="list" class="${state.playersTab === 'list' ? 'on' : ''}" aria-selected="${state.playersTab === 'list'}">Lista</button>
    <button role="tab" data-act="playerstab" data-tab="wardrobe" class="${state.playersTab === 'wardrobe' ? 'on' : ''}" aria-selected="${state.playersTab === 'wardrobe'}">Garderobe</button>
  </div>`;
  if (state.playersTab === 'wardrobe') return demoNote() + viewWardrobe(seg);
  return `
    ${demoNote()}
    <section class="card">${seg}
      <div class="card-head"><div><h2>Spillere</h2><p class="lede-sm">${lede}</p></div>${toggle}</div>
      ${active.length ? `<ul class="plist">${active.map(row).join('')}</ul>` : `<div class="empty">Ingen spillere enda. Legg til kollegaene dine under.</div>`}
      ${goneList}
      ${editing ? '' : `<form class="newrule" id="newRosterForm">
        <div class="block-head"><h3>Ny spiller</h3></div>
        <div class="newplayer">
          <input id="newRosterName" placeholder="Navn" maxlength="24" autocomplete="off" required ${ready ? '' : 'disabled'}>
          <button type="submit" ${ready ? '' : 'disabled'}>Legg til</button>
        </div>
      </form>`}
    </section>`;
}

/* ---------- Ark og varsler ---------- */
function openSheet(html){ const s = $('#sheet'); s.innerHTML = `<div class="sheet-bg" data-act="closesheet"></div><div class="sheet-panel" role="dialog" aria-modal="true">${html}</div>`; s.hidden = false; }
function closeSheet(){ $('#sheet').hidden = true; $('#sheet').innerHTML = ''; }
let sheetState = null;
function openCrawlSheet(ctx){
  sheetState = { ctx, selected: new Set(ctx.losers) };
  renderSheet();
}
function renderSheet(){
  const { ctx, selected } = sheetState;
  const m = ctx.match;
  let title = 'Kamp lagret', extra = '';
  if (ctx.pWin < UPSET_P){ title = 'Sensasjon!'; extra = 'Laget med lavest rating vant mot alle odds.'; }
  const wn = m.winner === 1 ? names(m.t1) : names(m.t2), ln = m.winner === 1 ? names(m.t2) : names(m.t1);
  const chips = ctx.losers.map(id => `<button class="chip${selected.has(id) ? ' is-on' : ''}" data-act="sheetchip" data-id="${esc(id)}" aria-pressed="${selected.has(id)}">${esc(nameOf(id))}</button>`).join('');
  openSheet(`
    <p class="sheet-kicker">Registrert</p>
    <h2 class="sheet-title">${title}</h2>
    <p class="sheet-result">${esc(wn)} vasket ${esc(ln)}.${extra ? ' ' + extra : ''}</p>
    <p class="q">Krabbet taperlaget under bordet?</p>
    <div class="chips">${chips}</div>
    <div class="sheet-actions">
      <button class="primary" data-act="sheetyes" ${selected.size ? '' : 'disabled'}>${selected.size ? `Ja, de krabbet (${selected.size})` : 'Velg hvem som krabbet'}</button>
      <button class="secondary" data-act="sheetno">Nei, slapp unna</button>
    </div>`);
}
function openCrawlOnlySheet(){
  sheetState = { ctx: { standalone: true }, selected: new Set() };
  renderCrawlOnlySheet();
}
function renderCrawlOnlySheet(){
  const { selected } = sheetState;
  const chips = state.players.filter(p => !p.archived).map(p => `<button class="chip${selected.has(p.id) ? ' is-on' : ''}" data-act="sheetchip" data-id="${esc(p.id)}" aria-pressed="${selected.has(p.id)}">${esc(p.name)}</button>`).join('');
  openSheet(`
    <p class="sheet-kicker">Uten kamp</p>
    <h2 class="sheet-title">Hvem krabbet?</h2>
    <p class="sheet-result">Gammel gjeld, tapt veddemål eller bare dårlig dømmekraft.</p>
    <div class="chips">${chips || '<span class="hint">Ingen spillere enda.</span>'}</div>
    <div class="sheet-actions">
      <button class="primary" data-act="sheetyes" ${selected.size ? '' : 'disabled'}>${selected.size ? `Registrer krabbing (${selected.size})` : 'Velg minst én'}</button>
      <button class="secondary" data-act="closesheet">Avbryt</button>
    </div>`);
}
function openExtraCrawlSheet(match){
  sheetState = { ctx: { extra: true, match }, selected: new Set() };
  renderExtraCrawlSheet();
}
function renderExtraCrawlSheet(){
  const { ctx, selected } = sheetState;
  const m = ctx.match, w1 = m.winner === 1;
  const ids = (w1 ? m.t2 : m.t1).concat(w1 ? m.t1 : m.t2);
  const chips = ids.map(id => `<button class="chip${selected.has(id) ? ' is-on' : ''}" data-act="sheetchip" data-id="${esc(id)}" aria-pressed="${selected.has(id)}">${esc(nameOf(id))}</button>`).join('');
  openSheet(`
    <p class="sheet-kicker">Ekstra krabbing</p>
    <h2 class="sheet-title">Hvem krabbet igjen?</h2>
    <p class="sheet-result">${esc(names(w1 ? m.t1 : m.t2))} vasket ${esc(names(w1 ? m.t2 : m.t1))}. Registreres som en egen krabbing på denne kampen.</p>
    <div class="chips">${chips}</div>
    <div class="sheet-actions">
      <button class="primary" data-act="sheetyes" ${selected.size ? '' : 'disabled'}>${selected.size ? `Registrer krabbing (${selected.size})` : 'Velg minst én'}</button>
      <button class="secondary" data-act="closesheet">Avbryt</button>
    </div>`);
}
function toast(msg, undo){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-act="undo">Angre</button>' : ''}`;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 7000 : 3500);
}

/* ---------- Handlinger ---------- */
function resetForm(){ form.red = []; form.blue = []; form.winner = null; }
function tapChip(id){
  const inRed = form.red.includes(id), inBlue = form.blue.includes(id);
  if (!inRed && !inBlue){
    if (form.red.length < 2) form.red.push(id);
    else if (form.blue.length < 2) form.blue.push(id);
    else { toast('Begge lag er fulle – fjern noen først'); return; }
  } else if (inRed){
    form.red = form.red.filter(x => x !== id);
    if (form.blue.length < 2) form.blue.push(id);
  } else form.blue = form.blue.filter(x => x !== id);
  renderScreen();
}
async function saveMatch(){
  if (!store || !form.red.length || !form.blue.length || !form.winner) return;
  const m = { t1: form.red.slice(), t2: form.blue.slice(), winner: form.winner, at: new Date().toISOString() };
  const { pWin } = expectedFor(m, state.derived ? state.derived.rating : new Map());
  const btn = $('#saveBtn'); if (btn){ btn.disabled = true; btn.textContent = 'Lagrer …'; }
  try {
    const id = await store.addMatch(m);
    lastAction = { matchId: id, crawlId: null, label: 'Kamp' };
    const losers = m.winner === 1 ? m.t2 : m.t1;
    resetForm();
    renderScreen();
    openCrawlSheet({ match: Object.assign({ id }, m), losers, pWin });
  } catch (e){
    console.error(e); renderScreen();
    toast(e && e.code === 'quota_exceeded' ? 'Databasen er full – slett gamle kamper først' : 'Kunne ikke lagre kampen. Prøv igjen.');
  }
}
async function addPlayer(name){
  name = name.trim().replace(/\s+/g, ' ');
  if (!name) return;
  if (!store){ toast('Vent litt – kobler til lagringen'); return; }
  const exists = state.players.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (exists){
    if (exists.archived){
      try { await store.updatePlayer(exists.id, { archived: false }); toast(`${exists.name} er med igjen`); }
      catch (e){ console.error(e); toast('Kunne ikke hente spilleren tilbake.'); }
    } else toast(`${exists.name} er allerede med`);
    renderScreen(); return;
  }
  let id = slug(name); const ids = new Set(state.players.map(p => p.id)); let n = 2; const base = id;
  while (ids.has(id)) id = base + '-' + n++;
  try { await store.addPlayer({ id, name, createdAt: new Date().toISOString() }); toast(`${name} er med i ligaen`); }
  catch (e){ console.error(e); toast('Kunne ikke legge til spilleren.'); }
  renderScreen();
}
// Behold linjeskift og avsnitt, men rydd bort doble mellomrom og tomme linjer utover én
const cleanRule = t => (t || '').replace(/\r/g, '').split('\n').map(l => l.replace(/[ \t]+/g, ' ').trim()).join('\n').replace(/\n{3,}/g, '\n\n').trim();
async function addRule(text){
  text = cleanRule(text);
  if (!text || !store) return;
  try { await store.addRule({ text, at: new Date().toISOString() }); toast('Regel lagt til'); }
  catch (e){ console.error(e); toast('Kunne ikke lagre regelen.'); }
}
async function saveDrafts(){
  const ids = Object.keys(rulesUi.drafts);
  if (!ids.length || !store) return;
  let saved = 0;
  for (const id of ids){
    const rule = state.rules.find(x => x.id === id);
    const text = cleanRule(rulesUi.drafts[id]);
    delete rulesUi.drafts[id];
    if (!rule || !text || text === rule.text) continue;
    try { await store.updateRule(id, text); saved++; }
    catch (e){ console.error(e); toast('Kunne ikke lagre endringen.'); }
  }
  if (saved) toast(saved === 1 ? 'Regel oppdatert' : saved + ' regler oppdatert');
}
async function savePlayerDrafts(){
  const ids = Object.keys(playersUi.drafts);
  if (!ids.length || !store) return;
  let saved = 0;
  for (const id of ids){
    const p = state.players.find(x => x.id === id);
    const name = (playersUi.drafts[id] || '').trim().replace(/\s+/g, ' ');
    delete playersUi.drafts[id];
    if (!p || !name || name === p.name) continue;
    if (state.players.some(x => x.id !== id && x.name.toLowerCase() === name.toLowerCase())){ toast(`${name} finnes allerede`); continue; }
    try { await store.updatePlayer(id, { name }); saved++; }
    catch (e){ console.error(e); toast('Kunne ikke lagre navnet.'); }
  }
  if (saved) toast(saved === 1 ? 'Navnet er oppdatert' : saved + ' navn oppdatert');
}
async function undo(){
  if (!lastAction) return;
  const a = lastAction; lastAction = null;
  try {
    if (a.matchId) await store.deleteMatch(a.matchId);
    else if (a.crawlId) await store.deleteCrawl(a.crawlId);
    toast('Angret – ' + a.label.toLowerCase() + ' er fjernet');
  } catch (e){ console.error(e); toast('Kunne ikke angre.'); }
}
function armConfirm(key){
  if (confirmKey === key) return true;
  confirmKey = key; clearTimeout(confirmTimer);
  confirmTimer = setTimeout(() => { confirmKey = null; renderScreen(); }, 4000);
  renderScreen();
  return false;
}
function shiftPeriod(dir){
  const d = state.derived; if (!d) return;
  const idx = d.months.indexOf(state.period.key);
  const next = d.months[idx + dir];
  if (next){ state.period.key = next; state.period.all = false; renderScreen(); }
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'chip') tapChip(el.dataset.id);
  else if (act === 'team'){ const n = Number(el.dataset.team); form.winner = form.winner === n ? null : n; renderScreen(); }
  else if (act === 'save') saveMatch();
  else if (act === 'goto'){ state.screen = el.dataset.screen; render(); window.scrollTo({ top: 0 }); }
  else if (act === 'tabletab'){ state.tableTab = el.dataset.tab; renderScreen(); }
  else if (act === 'playerstab'){ state.playersTab = el.dataset.tab; confirmKey = null; renderScreen(); window.scrollTo({ top: 0 }); }
  else if (act === 'pprev') shiftPeriod(-1);
  else if (act === 'pnext') shiftPeriod(1);
  else if (act === 'pall'){ state.period.all = !state.period.all; if (!state.period.all && state.derived) state.period.key = state.derived.nowKey; renderScreen(); }
  else if (act === 'crawlonly') openCrawlOnlySheet();
  else if (act === 'crawlextra'){ const m = state.matches.find(x => x.id === el.dataset.id); if (m) openExtraCrawlSheet(m); }
  else if (act === 'closesheet') closeSheet();
  else if (act === 'sheetchip'){
    const id = el.dataset.id; sheetState.selected.has(id) ? sheetState.selected.delete(id) : sheetState.selected.add(id);
    sheetState.ctx.standalone ? renderCrawlOnlySheet() : sheetState.ctx.extra ? renderExtraCrawlSheet() : renderSheet();
  }
  else if (act === 'sheetno'){ closeSheet(); toast('Kamp lagret', true); }
  else if (act === 'sheetyes'){
    const { ctx, selected } = sheetState; const players = Array.from(selected);
    closeSheet();
    try {
      const cid = await store.addCrawl({ players, matchId: ctx.standalone ? null : ctx.match.id, at: new Date().toISOString() });
      if (ctx.standalone || ctx.extra){ lastAction = { matchId: null, crawlId: cid, label: 'Krabbing' }; toast(`Krabbing lagret: ${names(players)}`, true); }
      else toast('Kamp og krabbing lagret', true);
    } catch (err){ console.error(err); toast('Kunne ikke lagre krabbingen.'); }
  }
  else if (act === 'undo'){ $('#toast').hidden = true; undo(); }
  else if (act === 'ruleedit'){ rulesUi.editing = true; confirmKey = null; renderScreen(); }
  else if (act === 'ruledone'){ rulesUi.editing = false; confirmKey = null; renderScreen(); await saveDrafts(); }
  else if (act === 'wrpick'){ wardrobe.id = el.dataset.id; wardrobe.draft = null; clearTimeout(wardrobeTimer); renderScreen(); }
  else if (act === 'wrset') setWardrobe({ [el.dataset.key]: el.dataset.val });
  else if (act === 'wrrandom'){ wardrobe.draft = randomAvatar(); renderScreen(); saveWardrobe(); }
  else if (act === 'wrreset'){ wardrobe.draft = defaultAvatar(wardrobe.id); renderScreen(); saveWardrobe(); }
  else if (act === 'playeredit'){ playersUi.editing = true; confirmKey = null; renderScreen(); }
  else if (act === 'playerdone'){ playersUi.editing = false; confirmKey = null; renderScreen(); await savePlayerDrafts(); }
  else if (act === 'delplayer'){
    const id = el.dataset.id;
    if (!armConfirm('p:' + id)) return;
    confirmKey = null;
    const c = (state.derived && state.derived.counts.get(id)) || { games: 0, crawls: 0 };
    const used = c.games > 0 || c.crawls > 0;
    const name = nameOf(id);
    delete playersUi.drafts[id];
    try {
      if (used){ await store.updatePlayer(id, { archived: true }); toast(`${name} er ute av lista, men står igjen i historikken`); }
      else { await store.deletePlayer(id); toast(`${name} er fjernet`); }
    } catch (err){ console.error(err); toast('Kunne ikke fjerne spilleren.'); renderScreen(); }
  }
  else if (act === 'unarchive'){
    const id = el.dataset.id;
    try { await store.updatePlayer(id, { archived: false }); toast(`${nameOf(id)} er med igjen`); }
    catch (err){ console.error(err); toast('Kunne ikke hente spilleren tilbake.'); }
  }
  else if (act === 'del'){
    const kind = el.dataset.kind, id = el.dataset.id;
    if (!armConfirm(kind[0] + ':' + id)) return;
    confirmKey = null;
    try {
      if (kind === 'match') await store.deleteMatch(id);
      else if (kind === 'crawl') await store.deleteCrawl(id);
      else await store.deleteRule(id);
      toast('Slettet');
    }
    catch (err){ console.error(err); toast('Kunne ikke slette.'); renderScreen(); }
  }
  else if (act === 'reset'){
    if (!armConfirm('reset')) return;
    confirmKey = null;
    try { await store.reset(); resetForm(); toast('Ligaen er nullstilt – legg til spillere og kjør i gang'); }
    catch (err){ console.error(err); toast('Kunne ikke nullstille.'); renderScreen(); }
  }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'newRosterForm'){ e.preventDefault(); const t = $('#newRosterName'); const v = t.value; t.value = ''; addPlayer(v); }
  else if (e.target.id === 'newRuleForm'){ e.preventDefault(); const t = $('#newRuleText'); const v = t.value; t.value = ''; addRule(v); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.tagName === 'TEXTAREA') grow(t);
  const key = t.dataset && t.dataset.edit;
  if (!key) return;
  const i = key.indexOf(':'), kind = key.slice(0, i), id = key.slice(i + 1);
  if (kind === 'rule') rulesUi.drafts[id] = t.value;
  else if (kind === 'player') playersUi.drafts[id] = t.value;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
$('#tabs').addEventListener('click', async e => {
  const b = e.target.closest('[data-screen]'); if (!b) return;
  const leavingRules = state.screen === 'rules' && rulesUi.editing;
  const leavingPlayers = state.screen === 'players' && playersUi.editing;
  state.screen = b.dataset.screen;
  if (leavingRules) rulesUi.editing = false;
  if (leavingPlayers) playersUi.editing = false;
  render(); window.scrollTo({ top: 0 });
  if (leavingRules) await saveDrafts();
  if (leavingPlayers) await savePlayerDrafts();
});

/* ---------- Oppstart ---------- */
function useLocal(){ if (store && store.kind === 'local') return; store = localStore(); state.mode = 'local'; store.start(); }
function start(saved){
  try {
    if (saved && saved.form && typeof saved.form === 'object'){ form.red = Array.isArray(saved.form.red) ? saved.form.red : []; form.blue = Array.isArray(saved.form.blue) ? saved.form.blue : []; form.winner = saved.form.winner || null; }
    if (saved && saved.screen) state.screen = saved.screen === 'wardrobe' ? 'players' : saved.screen;
    if (saved && saved.screen === 'wardrobe') state.playersTab = 'wardrobe';
    if (saved && saved.playersTab) state.playersTab = saved.playersTab;
    if (saved && saved.tableTab) state.tableTab = saved.tableTab;
    if (saved && saved.period && typeof saved.period === 'object') state.period = { all: !!saved.period.all, key: saved.period.key || null };
    if (saved && saved.wardrobeId) wardrobe.id = saved.wardrobeId;
  } catch (e) {}
  render();
  if (API_URL){ store = gasStore(); store.start(); return; }
  const c = window.claude;
  if (!c || typeof c.use !== 'function'){ useLocal(); return; }
  c.use('db').then(db => { if (db){ store = dbStore(db); store.start(); } else useLocal(); }).catch(() => useLocal());
}
try { window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function' && window.claude.hot.snapshot(() => ({ screen: state.screen, tableTab: state.tableTab, period: Object.assign({}, state.period), playersTab: state.playersTab, wardrobeId: wardrobe.id, form: Object.assign({}, form) })); } catch (e) {}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
